<!DOCTYPE html>
<html>
<head>
<title>Missions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Orbitron', sans-serif;
background:
linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.95)),
url('City.jpg');
background-size:cover;
background-position:center;
color:white;
min-height:100vh;
padding:30px 20px 60px;
}

/* Title */
.hubTitle{
max-width:520px;
margin:0 auto 35px auto;
padding:16px 24px;
text-align:center;
font-size:30px;
color:#39ff14;
background:rgba(0,0,0,0.75);
border:2px solid #39ff14;
border-radius:18px;
box-shadow:0 0 14px #39ff14;
text-shadow:0 0 10px #39ff14;
}

/* Mission area */
.missionsWrap{
max-width:760px;
margin:0 auto;
display:flex;
flex-direction:column;
gap:22px;
}

.missionRow{
display:flex;
justify-content:center;
gap:22px;
flex-wrap:wrap;
}

.missionCard{
min-width:260px;
max-width:320px;
width:100%;
padding:18px 20px;
text-align:center;
background:rgba(0,0,0,0.75);
border:2px solid #a020f0;
border-radius:18px;
box-shadow:0 0 14px #a020f0, inset 0 0 12px #a020f0;
color:#39ff14;
cursor:pointer;
transition:0.2s ease;
}

.missionCard:hover{
transform:translateY(-2px);
box-shadow:0 0 18px #a020f0, inset 0 0 14px #a020f0;
}

.locked{
color:#777;
border:2px solid #555;
box-shadow:none;
cursor:default;
}

.locked:hover{
transform:none;
box-shadow:none;
}

.hiddenMission{
letter-spacing:3px;
}

/* Back button */
.backBtn{
display:block;
width:100%;
max-width:320px;
margin:35px auto 0 auto;
padding:12px;
text-align:center;
background:black;
border:2px solid #39ff14;
border-radius:12px;
color:#39ff14;
box-shadow:0 0 10px #39ff14;
cursor:pointer;
font-family:'Orbitron', sans-serif;
}

/* Overlay */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.82);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
padding:20px;
}

.overlay.active{
display:flex;
}

.popup{
width:100%;
max-width:420px;
background:black;
border:2px solid #a020f0;
border-radius:18px;
box-shadow:0 0 18px #a020f0, inset 0 0 12px #a020f0;
padding:24px 20px;
text-align:center;
}

.popupText{
color:#39ff14;
font-size:18px;
line-height:1.5;
margin-bottom:20px;
}

.popupButtons{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.popupButtons button{
flex:1;
min-width:120px;
padding:12px;
background:black;
border:2px solid #39ff14;
border-radius:12px;
color:#39ff14;
font-family:'Orbitron', sans-serif;
cursor:pointer;
box-shadow:0 0 10px #39ff14;
}

/* Mobile */
@media (max-width:700px){
.hubTitle{
font-size:24px;
}
.missionRow{
gap:16px;
}
.missionCard{
min-width:100%;
}
}
</style>
</head>

<body>

<div class="hubTitle">Missions Hub</div>

<div class="missionsWrap">

  <div class="missionRow">
    <div class="missionCard" onclick="openMissionPopup('welcome')">
      Welcome to Cyrene
    </div>

    <div class="missionCard locked">
      Enter the Port
    </div>
  </div>

  <div class="missionRow">
    <div class="missionCard locked hiddenMission">
      ???
    </div>
  </div>

</div>

<button class="backBtn" onclick="location.href='profile.html'">Back</button>

<div id="overlay" class="overlay">
  <div class="popup">
    <div class="popupText" id="popupText"></div>
    <div class="popupButtons">
      <button onclick="confirmMissionStart()">Yes</button>
      <button onclick="closePopup()">No</button>
    </div>
  </div>
</div>

<script>
let selectedMission = null;

function openMissionPopup(missionId){
  if(missionId === 'welcome'){
    selectedMission = missionId;
    document.getElementById('popupText').innerText =
      'Would you like to start mission "Welcome to Cyrene"?';
    document.getElementById('overlay').classList.add('active');
  }
}

function closePopup(){
  selectedMission = null;
  document.getElementById('overlay').classList.remove('active');
}

function confirmMissionStart(){
  if(selectedMission === 'welcome'){
    location.href = 'mission1.html';
  }
}
</script>

</body>
</html>
