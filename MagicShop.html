<!DOCTYPE html>
<html>
<head>
<title>Va'shir's Magic Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Orbitron', sans-serif;
color:white;
text-align:center;
min-height:100vh;
background:
linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.88)),
url("City.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.container{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:140px 20px 30px;
}

.shopBox{
position:relative;
width:100%;
max-width:680px;
padding:180px 24px 32px;
background:rgba(0,0,0,0.72);
border:2px solid #a020f0;
border-radius:22px;
box-shadow:
0 0 20px #a020f0,
0 0 50px #a020f0 inset;
}

/* portrait image, slightly rounded */
.npc{
position:absolute;
top:-115px;
left:50%;
transform:translateX(-50%);
width:250px;
max-width:72%;
height:auto;
display:block;
border-radius:22px;
border:3px solid #39ff14;
box-shadow:
0 0 18px #39ff14,
0 0 35px #39ff14;
background:black;
}

#dialogue{
color:#39ff14;
text-shadow:0 0 8px #39ff14;
font-size:20px;
line-height:1.6;
min-height:96px;
max-width:540px;
margin:0 auto;
}

.buttons{
margin-top:22px;
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

.shopBtn{
padding:12px 22px;
background:black;
border:2px solid #39ff14;
border-radius:12px;
color:#39ff14;
font-family:'Orbitron', sans-serif;
font-size:15px;
cursor:pointer;
box-shadow:0 0 10px rgba(57,255,20,0.35);
}

.shopBtn:hover{
box-shadow:0 0 14px #39ff14;
}

@media(max-width:700px){
.container{
padding-top:120px;
}

.shopBox{
padding:145px 18px 28px;
}

.npc{
top:-95px;
width:200px;
max-width:78%;
border-radius:18px;
}

#dialogue{
font-size:17px;
min-height:84px;
}

.shopBtn{
width:100%;
max-width:220px;
}
}
</style>
</head>

<body>

<div class="container">
  <div class="shopBox">

    <img src="vashir.jpg" class="npc" alt="Va'shir">

    <div id="dialogue"></div>

    <div class="buttons">
      <button class="shopBtn" onclick="shop()">Shop</button>
      <button class="shopBtn" onclick="trade()">Trade</button>
      <button class="shopBtn" onclick="leaveShop()">Leave</button>
    </div>

  </div>
</div>

<script>
const openingText = "Welcome to Va'shir's Magic Shop. Va'shir has many things you need... and many you want.";
let i = 0;

function typeOpening(){
  const box = document.getElementById("dialogue");
  if(i < openingText.length){
    box.innerHTML += openingText.charAt(i);
    i++;
    setTimeout(typeOpening, 28);
  }
}

function setDialogue(text){
  document.getElementById("dialogue").innerHTML = text;
}

function shop(){
  setDialogue("Take your time. Rare things rarely wait for the indecisive.");
}

function trade(){
  setDialogue("Show Va'shir what you carry. Fair trade is a matter of perspective.");
}

function leaveShop(){
  window.location.href = "profile.html";
}

typeOpening();
</script>

</body>
</html>
