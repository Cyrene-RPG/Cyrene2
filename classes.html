<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Orbitron', sans-serif;
background:#050505;
color:#d8d8d8;
}

/* MAIN */
.main{
max-width:900px;
margin:auto;
padding:30px 20px;
}

/* TITLE */
.title{
font-size:32px;
color:#39ff14;
margin-bottom:20px;
text-shadow:0 0 12px #39ff14;
}

/* SECTION */
.section{
margin-bottom:30px;
}

.sectionTitle{
color:#39ff14;
margin-bottom:10px;
font-size:18px;
text-shadow:0 0 8px #39ff14;
}

/* BUTTON LIST */
.list{
border-left:2px solid #a020f0;
padding-left:15px;
}

/* BUTTON */
.classBtn{
display:block;
margin:10px 0;
padding:12px 15px;
border-radius:10px;
border:2px solid #39ff14;
color:#39ff14;
text-decoration:none;
background:black;
transition:0.2s;
}

.classBtn:hover{
box-shadow:0 0 10px #39ff14;
transform:translateX(5px);
}

/* LOCKED */
.locked{
border:2px dashed #555;
color:#555;
cursor:not-allowed;
}

/* BACK BUTTON */
.backBtn{
display:inline-block;
margin-bottom:20px;
padding:10px 20px;
border:2px solid #39ff14;
border-radius:10px;
color:#39ff14;
text-decoration:none;
}

.backBtn:hover{
box-shadow:0 0 10px #39ff14;
}
</style>
</head>

<body>

<a href="bard.html" class="classBtn">Sosenja</a>

<a href="shamans.html" class="classBtn">Shamans</a>

<a href="mercenaries.html" class="classBtn">Mercenaries</a>

</div>
</div>

<!-- ===== FUTURE ===== -->

</div>
