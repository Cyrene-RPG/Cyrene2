<!DOCTYPE html>
<html>
<head>
<title>Cyrene - Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

<style>
body{
margin:0;font-family:'Orbitron';color:white;text-align:center;
background:linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),url('City.jpg');
background-size:cover;
}

.box{
margin:60px auto;width:90%;max-width:400px;
padding:30px;border:2px solid #7a00ff;border-radius:12px;
background:rgba(0,0,0,0.6);
}

input{
width:100%;padding:12px;margin:10px 0;
background:black;border:2px solid #39ff14;color:#39ff14;
}

button{
width:100%;padding:14px;margin-top:15px;
background:black;border:2px solid #39ff14;color:#39ff14;
}
</style>
</head>

<body>

<div class="box">
<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">CREATE</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBQDReiSnFX3cs9Y4QW70cWQKblPe0-IPQ",
authDomain:"cyrene-8f351.firebaseapp.com",
projectId:"cyrene-8f351",
storageBucket:"cyrene-8f351.appspot.com",
messagingSenderId:"574109223643",
appId:"1:574109223643:web:1d713a3c5f1503c7fbdafe"
};

const app = initializeApp(firebaseConfig, "MAIN");
const auth = getAuth(app);
const db = getFirestore(app);

await setPersistence(auth, browserLocalPersistence);

window.signup = async ()=>{
let u=document.getElementById("username").value;
let e=document.getElementById("email").value;
let p=document.getElementById("password").value;

try{
let cred=await createUserWithEmailAndPassword(auth,e,p);

await setDoc(doc(db,"users",cred.user.uid),{
username:u
});

location.href="profile.html";

}catch(err){alert(err.message);}
};
</script>

</body>
</html>
